<!DOCTYPE html><html><head><meta charset="utf-8"><title>testing</title></head><body>
<pre id="o">running...</pre>
<script>
const F='https://feeds.bbci.co.uk/news/rss.xml';
const E=encodeURIComponent(F);
const ps=[
 ['corsfix','https://proxy.corsfix.com/?url='+E],
 ['corsproxy.io','https://corsproxy.io/?url='+E],
 ['allorigins-raw','https://api.allorigins.win/raw?url='+E],
 ['allorigins-get','https://api.allorigins.win/get?url='+E],
 ['codetabs','https://api.codetabs.com/v1/proxy?quest='+E],
 ['r.jina.ai','https://r.jina.ai/'+F],
 ['corsproxy.org','https://corsproxy.org/?url='+E],
 ['cors.workers.dev','https://test.cors.workers.dev/?'+F],
 ['direct',F]
];
async function one(n,u){
 const ac=new AbortController();
 const tm=setTimeout(()=>ac.abort(),8000);
 try{
  const x=await fetch(u,{signal:ac.signal});
  const t=await x.text();
  const ok=/<rss|<feed|<rdf|<title/i.test(t.slice(0,800));
  return n+'='+x.status+(ok?'|XML|len'+t.length:'|'+t.slice(0,20).replace(/\s+/g,' '));
 }catch(e){return n+'=ERR:'+String(e.message).slice(0,20);}
 finally{clearTimeout(tm);}
}
(async()=>{
 const r=[];
 for(const [n,u] of ps) r.push(await one(n,u));
 document.title='RESULT '+r.join(' ## ');
 document.getElementById('o').textContent=r.join('\n');
})();
</script></body></html>
