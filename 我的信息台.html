<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="description" content="个人 AI 信息工作台：RSS + 大模型打分，自动分栏">
<title>我的信息台</title>
<style>
:root{
  --bg:#0b0d12; --bg2:#12151d; --card:#171b25; --card2:#1d222e;
  --line:#262c3a; --txt:#e6e8ee; --dim:#8b93a7; --dim2:#5f6678;
  --acc:#5b8cff; --acc2:#7c5cff;
  --hi:#ff5d5d; --mid:#ffb020; --low:#3ecf8e;
  --shadow:0 8px 24px rgba(0,0,0,.35);
  --r:14px;
}
html[data-theme="light"]{
  --bg:#f4f6fa; --bg2:#fff; --card:#fff; --card2:#f7f8fb;
  --line:#e3e7ef; --txt:#1a1d26; --dim:#6b7286; --dim2:#9aa1b1;
  --acc:#2f6bff; --acc2:#6b46e5;
  --shadow:0 6px 20px rgba(20,30,60,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.6; padding-bottom:env(safe-area-inset-bottom);
  transition:background .25s,color .25s;
}
a{color:var(--acc);text-decoration:none}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}

/* ── 顶栏 ── */
header{
  position:sticky;top:0;z-index:50;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.logo{font-weight:700;font-size:16px;letter-spacing:.3px;display:flex;align-items:center;gap:7px}
.logo .dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 0 12px var(--acc)}
.logo small{font-weight:400;font-size:11px;color:var(--dim2);margin-left:2px}
.sp{flex:1}
.btn{
  padding:7px 13px;border-radius:10px;background:var(--card2);border:1px solid var(--line);
  font-size:13px;color:var(--dim);transition:.15s;white-space:nowrap;
}
.btn:hover{color:var(--txt);border-color:var(--acc)}
.btn.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent;font-weight:600}
.btn.pri:disabled{opacity:.5;cursor:not-allowed}
.btn.on{border-color:var(--acc);color:var(--acc)}

/* ── 配置区 ── */
#cfg{
  display:none;background:var(--bg2);border-bottom:1px solid var(--line);
  padding:16px;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
}
#cfg.show{display:grid}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label{font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.4px}
.fld .hint{font-size:11px;color:var(--dim2);line-height:1.45}
input,textarea,select{
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:9px 11px;outline:none;transition:.15s;width:100%;
}
input:focus,textarea:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 15%,transparent)}
textarea{resize:vertical;min-height:74px;line-height:1.55}
.fld.full{grid-column:1/-1}
.row2{display:flex;gap:8px;flex-wrap:wrap}

/* ── 统计条 ── */
#bar{
  display:flex;gap:8px;padding:12px 16px;overflow-x:auto;
  border-bottom:1px solid var(--line);background:var(--bg);
}
.stat{
  flex:1;min-width:104px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:9px 12px;cursor:pointer;transition:.15s;
}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.stat.act{border-color:var(--acc)}
.stat b{display:block;font-size:20px;line-height:1.2}
.stat span{font-size:11px;color:var(--dim)}
.stat i{font-style:normal;font-size:10px;color:var(--dim2)}

/* ── 看板 ── */
#board{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;
  padding:16px;align-items:start;
}
.col{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);min-height:180px;transition:.15s}
.col.over{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 7%,var(--bg2))}
.col>h3{
  margin:0;padding:12px 14px 10px;font-size:13px;font-weight:700;
  display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--line);
  position:sticky;top:53px;background:var(--bg2);border-radius:var(--r) var(--r) 0 0;z-index:5;
}
.col>h3 .n{font-size:11px;color:var(--dim2);font-weight:500}
.col>h3 .tag{width:8px;height:8px;border-radius:3px}
.c1 .tag{background:var(--hi)} .c2 .tag{background:var(--mid)} .c3 .tag{background:var(--low)}
.list{padding:10px;display:flex;flex-direction:column;gap:9px;min-height:120px}
.item{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:11px 12px;cursor:grab;transition:.15s;position:relative;
}
.item:hover{border-color:var(--acc);transform:translateY(-1px);box-shadow:var(--shadow)}
.item.drag{opacity:.35}
.item h4{margin:0 0 5px;font-size:14px;line-height:1.45;font-weight:600;padding-right:26px}
.item p{margin:0;font-size:12.5px;color:var(--dim);line-height:1.55}
.item .meta{margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--dim2)}
.item .src{background:var(--card2);padding:2px 7px;border-radius:6px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sc{font-weight:700;padding:2px 7px;border-radius:6px;font-size:11px}
.s-hi{background:color-mix(in srgb,var(--hi) 18%,transparent);color:var(--hi)}
.s-mid{background:color-mix(in srgb,var(--mid) 18%,transparent);color:var(--mid)}
.s-low{background:color-mix(in srgb,var(--low) 18%,transparent);color:var(--low)}
.item .why{margin-top:7px;font-size:11.5px;color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent);padding:6px 8px;border-radius:8px;line-height:1.5}
.item .del{position:absolute;top:8px;right:8px;color:var(--dim2);font-size:15px;line-height:1;padding:2px 5px;border-radius:6px;opacity:0;transition:.15s}
.item:hover .del{opacity:1}
.item .del:hover{color:var(--hi);background:color-mix(in srgb,var(--hi) 12%,transparent)}
.empty{text-align:center;color:var(--dim2);font-size:12px;padding:26px 10px;border:1px dashed var(--line);border-radius:12px}

/* ── 日志 ── */
#log{
  display:none;margin:0 16px 18px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:11px 13px;font-size:12px;color:var(--dim);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;max-height:150px;overflow:auto;line-height:1.7;
}
#log.show{display:block}

/* ── 弹层 ── */
#mask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:80;backdrop-filter:blur(3px)}
#mask.show{display:block}
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:90;
  background:var(--bg2);border-top:1px solid var(--line);
  border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform .28s cubic-bezier(.3,.8,.3,1);max-height:88vh;overflow:auto;
}
#sheet.show{transform:translateY(0)}
#sheet .bar{width:38px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 14px}
#sheet h2{margin:0 0 4px;font-size:17px}
#sheet .sub{font-size:12px;color:var(--dim);margin-bottom:14px;line-height:1.6}
.kbd{background:var(--card2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11px;font-family:monospace}

@media(max-width:900px){
  #board{grid-template-columns:1fr;gap:12px;padding:12px}
  .col>h3{position:static;border-radius:var(--r) var(--r) 0 0}
  .stat{min-width:calc(50% - 4px)}
  .item{cursor:default}
  .item h4{padding-right:22px}
}
</style>
</head>
<body>

<header>
  <div class="logo"><span class="dot"></span>我的信息台<small>AI 分栏</small></div>
  <div class="sp"></div>
  <button class="btn" id="bDemo">载入演示</button>
  <button class="btn pri" id="bPull">拉取更新</button>
  <button class="btn" id="bCfg">设置</button>
</header>

<section id="cfg">
  <div class="fld full">
    <label>关注点（写给 AI 的订阅画像）</label>
    <textarea id="cFocus" placeholder="例：我关注 AI 编程工具与 Agent 工程化、独立开发者出海变现、宏观与利率对科技股的影响。不关心娱乐八卦、榜单和纯融资快讯。"></textarea>
    <div class="hint">这段会原样进 AI 提示词，直接决定打分准不准。写得越具体，噪音越少。</div>
  </div>
  <div class="fld">
    <label>大模型 API Key（MiMo / 任何 OpenAI 兼容接口）</label>
    <input id="cKey" type="password" placeholder="sk-..." autocomplete="off">
    <div class="hint">只存在你这台设备的浏览器 localStorage，不会上传任何服务器。</div>
  </div>
  <div class="fld">
    <label>接口地址</label>
    <input id="cBase" placeholder="https://api.xiaomimimo.com/v1">
    <div class="hint">DeepSeek 填 https://api.deepseek.com/v1</div>
  </div>
  <div class="fld">
    <label>模型名</label>
    <input id="cModel" placeholder="mimo-v2.6-flash">
    <div class="hint">便宜档 flash，质量档 pro</div>
  </div>
  <div class="fld">
    <label>RSS 源（一行一个）</label>
    <textarea id="cFeeds" style="min-height:96px" placeholder="https://sspai.com/feed
https://rsshub.app/weibo/user/123456
# 井号开头是注释，会被忽略"></textarea>
    <div class="hint">公众号/微博/B站/知乎用 RSSHub 拼路由。</div>
  </div>
  <div class="fld full">
    <div class="row2">
      <button class="btn pri" id="bSave">保存并收起</button>
      <button class="btn" id="bExport">导出配置</button>
      <button class="btn" id="bImport">导入配置</button>
      <button class="btn" id="bClear">清空已读记录</button>
      <input type="file" id="fFile" accept=".json" style="display:none">
    </div>
    <div class="hint">换电脑或换浏览器时用导出/导入搬家；Key 也会一起导出，注意别把文件发到群里。</div>
  </div>
</section>

<div id="bar">
  <div class="stat" data-f="hi"><b id="n1">0</b><span>必读</span><i>≥8 分</i></div>
  <div class="stat" data-f="mid"><b id="n2">0</b><span>该看</span><i>5–7 分</i></div>
  <div class="stat" data-f="low"><b id="n3">0</b><span>扫一眼</span><i>&lt;5 分</i></div>
  <div class="stat" data-f="all"><b id="n4">0</b><span>累计入库</span><i>去重后</i></div>
</div>

<main id="board">
  <section class="col c1" data-lv="hi">
    <h3><span class="tag"></span>必读 <span class="n" id="c1n"></span></h3>
    <div class="list" data-lv="hi"></div>
  </section>
  <section class="col c2" data-lv="mid">
    <h3><span class="tag"></span>该看 <span class="n" id="c2n"></span></h3>
    <div class="list" data-lv="mid"></div>
  </section>
  <section class="col c3" data-lv="low">
    <h3><span class="tag"></span>扫一眼 <span class="n" id="c3n"></span></h3>
    <div class="list" data-lv="low"></div>
  </section>
</main>

<div id="log"></div>

<div id="mask"></div>
<div id="sheet">
  <div class="bar"></div>
  <h2 id="sTitle"></h2>
  <div class="sub" id="sSub"></div>
  <div class="row2">
    <button class="btn pri" id="sGo">执行</button>
    <button class="btn" id="sClose">先不了</button>
  </div>
</div>

<script>
/* ══════════ 存储 ══════════ */
const K = 'myboard_v2';
const CFG_DEF = {
  focus: '', key: '', base: 'https://api.xiaomimimo.com/v1',
  model: 'mimo-v2.6-flash',
  feeds: ['https://sspai.com/feed', 'https://www.ruanyifeng.com/blog/atom.xml']
};
let S = load();
function load(){
  try{
    const o = JSON.parse(localStorage.getItem(K)) || {};
    return { cfg:{...CFG_DEF, ...(o.cfg||{})}, items: o.items||[], seen: o.seen||{} };
  }catch(e){ return { cfg:{...CFG_DEF}, items:[], seen:{} }; }
}
function save(){ localStorage.setItem(K, JSON.stringify(S)); }

/* ══════════ 工具 ══════════ */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = t => String(t||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const host = u => { try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return '未知源'; } };
const PROXY = 'https://corsproxy.io/?url=';   // 兜底代理，可换成自建
function log(m){
  const el = $('#log'); el.classList.add('show');
  const t = new Date().toLocaleTimeString('zh-CN',{hour12:false});
  el.insertAdjacentHTML('beforeend', `<div>[${t}] ${esc(m)}</div>`);
  el.scrollTop = el.scrollHeight;
}
function toast(m){ log(m); }

/* ══════════ 配置面板 ══════════ */
function fillCfg(){
  $('#cFocus').value = S.cfg.focus;
  $('#cKey').value   = S.cfg.key;
  $('#cBase').value  = S.cfg.base;
  $('#cModel').value = S.cfg.model;
  $('#cFeeds').value = S.cfg.feeds.join('\n');
}
function readCfg(){
  S.cfg.focus  = $('#cFocus').value.trim();
  S.cfg.key    = $('#cKey').value.trim();
  S.cfg.base   = $('#cBase').value.trim().replace(/\/$/,'');
  S.cfg.model  = $('#cModel').value.trim();
  S.cfg.feeds  = $('#cFeeds').value.split('\n').map(s=>s.trim()).filter(s=>s && !s.startsWith('#'));
  save();
}
$('#bCfg').onclick = () => { fillCfg(); $('#cfg').classList.toggle('show'); };
$('#bSave').onclick = () => { readCfg(); $('#cfg').classList.remove('show'); toast('配置已存到本地'); };
$('#bExport').onclick = () => {
  readCfg();
  const blob = new Blob([JSON.stringify(S,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '我的信息台-配置.json'; a.click();
  toast('已导出，含 API Key，别外传');
};
$('#bImport').onclick = () => $('#fFile').click();
$('#fFile').onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const o = JSON.parse(r.result);
      S = { cfg:{...CFG_DEF,...(o.cfg||{})}, items:o.items||[], seen:o.seen||{} };
      save(); fillCfg(); render(); toast('配置已导入');
    }catch(err){ toast('导入失败：不是合法的 JSON'); }
  };
  r.readAsText(f);
};
$('#bClear').onclick = () => {
  sheet('清空已读记录？', '清空后之前抓过的条目会被重新判定一次，可能产生重复。配置不受影响。', () => {
    S.seen = {}; save(); toast('已读记录已清空');
  });
};
$$('.stat').forEach(el => el.onclick = () => {
  const f = el.dataset.f;
  $$('.stat').forEach(x=>x.classList.toggle('act', x===el && f!=='all'));
  $$('.item').forEach(it => it.style.display = (f==='all' || it.dataset.lv===f) ? '' : 'none');
});

/* ══════════ 弹层 ══════════ */
let sheetFn = null;
function sheet(title, sub, fn, goText){
  $('#sTitle').textContent = title; $('#sSub').textContent = sub;
  $('#sGo').textContent = goText || '确认';
  sheetFn = fn; $('#mask').classList.add('show'); $('#sheet').classList.add('show');
}
function closeSheet(){ $('#mask').classList.remove('show'); $('#sheet').classList.remove('show'); sheetFn=null; }
$('#sGo').onclick = () => { const f = sheetFn; closeSheet(); f && f(); };
$('#sClose').onclick = closeSheet;
$('#mask').onclick = closeSheet;

/* ══════════ 主题 ══════════ */
const TH = localStorage.getItem('myboard_theme') || 'dark';
document.documentElement.setAttribute('data-theme', TH);
(function(){
  const b = document.createElement('button');
  b.className = 'btn'; b.textContent = TH==='dark' ? '☀️' : '🌙';
  b.title = '切换深浅色';
  b.onclick = () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const nx = cur==='dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', nx);
    localStorage.setItem('myboard_theme', nx);
    b.textContent = nx==='dark' ? '☀️' : '🌙';
    document.querySelector('meta[name=theme-color]').setAttribute('content', nx==='dark'?'#0b0d12':'#f4f6fa');
  };
  document.querySelector('header .sp').before(b);
})();

/* ══════════ RSS 解析 ══════════ */
async function getXML(url){
  try{
    const r = await fetch(url, {headers:{'Accept':'application/rss+xml, application/atom+xml, application/xml'}});
    if(r.ok) return await r.text();
    throw new Error('HTTP '+r.status);
  }catch(e){
    log(`直连失败(${host(url)})，走代理重试`);
    const r = await fetch(PROXY + encodeURIComponent(url));
    if(!r.ok) throw new Error('代理也失败 '+r.status);
    return await r.text();
  }
}
function pick(t, tags){
  for(const t2 of tags){
    const m = t.querySelector(t2);
    if(m && m.textContent.trim()) return m.textContent.trim();
  }
  return '';
}
function parse(xml, src){
  const d = new DOMParser().parseFromString(xml, 'text/xml');
  if(d.querySelector('parsererror')) throw new Error('不是合法 XML');
  const nodes = [...d.querySelectorAll('item'), ...d.querySelectorAll('entry')];
  return nodes.slice(0, 25).map(n => {
    const link = n.querySelector('link');
    let url = link ? (link.getAttribute('href') || link.textContent || '').trim() : '';
    if(!url){ const g = n.querySelector('guid'); url = g ? g.textContent.trim() : ''; }
    const enc = n.querySelector('enclosure');
    if(!url && enc) url = enc.getAttribute('url') || '';
    const body = pick(n,['content:encoded','content','description','summary']) || '';
    return {
      id: url || (pick(n,['guid','id']) || src + Math.random()),
      title: pick(n,['title']) || '(无标题)',
      url, src,
      text: body.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').slice(0, 2000),
      date: pick(n,['pubDate','published','updated','dc:date'])
    };
  }).filter(x => x.url || x.title);
}

/* ══════════ AI 打分 ══════════ */
async function judge(batch, cfg){
  const list = batch.map((b,i) => `${i}. 【${b.src}】${b.title}\n   ${b.text.slice(0,700)}`).join('\n');
  const sys = `你是个人信息筛选助手。用户关注点：${cfg.focus || '（未填写，按通用科技视角判断）'}
对每条信息打 0-10 分：10=必须马上读，7=值得读，4=有空扫，0=无关。
只输出 JSON 数组，不要 markdown 代码块，不要任何解释。格式：
[{"i":0,"score":8,"summary":"30字内中文摘要","why":"一句话说清为什么值得他看","category":"标签"}]`;
  const r = await fetch(cfg.base + '/chat/completions', {
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},
    body: JSON.stringify({ model: cfg.model, temperature: 0.2,
      messages:[{role:'system',content:sys},{role:'user',content:list}] })
  });
  if(!r.ok) throw new Error('模型接口 '+r.status+' '+(await r.text()).slice(0,160));
  const j = await r.json();
  let txt = (j.choices?.[0]?.message?.content || '').trim();
  txt = txt.replace(/^```(?:json)?/i,'').replace(/```$/,'');
  const s = txt.indexOf('['), e = txt.lastIndexOf(']');
  if(s<0) throw new Error('模型没返回数组');
  return JSON.parse(txt.slice(s, e+1));
}
function lvOf(sc){ return sc>=8 ? 'hi' : (sc>=5 ? 'mid' : 'low'); }

/* ══════════ 拉取主流程 ══════════ */
let busy = false;
$('#bPull').onclick = async () => {
  if(busy) return;
  const cfg = {...S.cfg};
  if(!cfg.feeds.length) return toast('先到设置里填 RSS 源');
  if(!cfg.key) return sheet('还没填 API Key', '不填 Key 只能看演示数据。到「设置」里贴一个 MiMo 或 DeepSeek 的 Key，存在你自己浏览器里。', ()=>{ $('#cfg').classList.add('show'); fillCfg(); }, '去填');
  busy = true; $('#bPull').disabled = true; $('#log').classList.add('show');
  try{
    let fresh = [];
    for(const f of cfg.feeds){
      try{
        const xml = await getXML(f);
        const arr = parse(xml, host(f)).filter(x => !S.seen[x.id]);
        log(`${host(f)}：${arr.length} 条新`);
        fresh = fresh.concat(arr);
      }catch(e){ log(`✗ ${host(f)}：${e.message}`); }
    }
    if(!fresh.length){ toast('没有新内容，都读过了'); return; }

    let kept = fresh;
    if(cfg.focus || true){
      try{
        const out = [];
        for(let i=0;i<kept.length;i+=10){
          const r = await judge(kept.slice(i,i+10), cfg);
          r.forEach(o => {
            const it = kept[o.i]; if(!it) return;
            it.score = Math.max(0, Math.min(10, Number(o.score)||0));
            it.summary = String(o.summary||'').slice(0,120);
            it.why = String(o.why||'').slice(0,160);
            it.category = String(o.category||'').slice(0,20);
            out.push(it);
          });
        }
        kept = out;
        log(`AI 打分完成：${out.length} 条`);
      }catch(e){
        log('AI 打分失败，全部按 5 分入库：'+e.message);
        kept.forEach(x => { x.score=5; x.summary=x.text.slice(0,80); x.why='AI 不可用，未判定'; });
      }
    }
    kept.forEach(x => { x.lv = lvOf(x.score); S.seen[x.id] = 1; });
    S.items = kept.concat(S.items).slice(0, 400);
    save(); render();
    const n = kept.filter(x=>x.lv==='hi').length;
    toast(`完成：新增 ${kept.length} 条，其中必读 ${n} 条`);
  }finally{ busy=false; $('#bPull').disabled=false; }
};

/* ══════════ 渲染 ══════════ */
function card(it){
  const cls = it.lv==='hi' ? 's-hi' : (it.lv==='mid' ? 's-mid' : 's-low');
  return `<article class="item" draggable="true" data-lv="${it.lv}" data-id="${esc(it.id)}">
    <button class="del" title="删掉">×</button>
    <h4>${it.url?`<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>`:esc(it.title)}</h4>
    <p>${esc(it.summary || it.text.slice(0,90) || '（无摘要）')}</p>
    <div class="meta">
      <span class="sc ${cls}">${it.score} 分</span>
      <span class="src">${esc(it.src)}</span>
      ${it.category?`<span class="src">${esc(it.category)}</span>`:''}
    </div>
    ${it.why && !it.why.startsWith('AI 不可用') ? `<div class="why">${esc(it.why)}</div>`:''}
  </article>`;
}
function render(){
  const inLv = k => S.items.filter(x=>x.lv===k);
  const html = k => { const a=inLv(k); return a.length ? a.map(card).join('') : '<div class="empty">这一栏还空着</div>'; };
  $('[data-lv=hi] .list').innerHTML = html('hi');
  $('[data-lv=mid] .list').innerHTML = html('mid');
  $('[data-lv=low] .list').innerHTML = html('low');
  $('#n1').textContent = inLv('hi').length;
  $('#n2').textContent = inLv('mid').length;
  $('#n3').textContent = inLv('low').length;
  $('#n4').textContent = S.items.length;
  $('#c1n').textContent = inLv('hi').length;
  $('#c2n').textContent = inLv('mid').length;
  $('#c3n').textContent = inLv('low').length;
  bind();
}
function bind(){
  $$('.item').forEach(el => {
    el.querySelector('.del').onclick = () => {
      const id = el.dataset.id;
      S.items = S.items.filter(x=>x.id!==id); save(); render();
    };
    el.ondragstart = () => { el.classList.add('drag'); el.dataset.from = el.closest('.col').dataset.lv; };
    el.ondragend   = () => { el.classList.remove('drag'); $$('.col').forEach(c=>c.classList.remove('over')); };
  });
}
$$('.col').forEach(col => {
  col.ondragover = e => { e.preventDefault(); col.classList.add('over'); };
  col.ondragleave = () => col.classList.remove('over');
  col.ondrop = e => {
    e.preventDefault(); col.classList.remove('over');
    const el = e.target.closest('.item'); if(!el) return;
    const it = S.items.find(x=>x.id===el.dataset.id); if(!it) return;
    it.lv = col.dataset.lv;
    if(el.dataset.from !== it.lv) it.score = it.lv==='hi'?8:(it.lv==='mid'?6:3);
    save(); render();
  };
});

  {title:'某 AI 编程工具宣布日活破百万',src:'36kr.com',score:3,summary:'官方口径的增长数据，无产品细节。',why:'纯 PR 稿，看标题即可。',category:'快讯'},
  {title:'把 RSS 变成 LLM 的素材管道：我的零成本方案',src:'ruanyifeng.com',score:8,summary:'用 RSSHub + 本地规则粗筛，把送进模型的 token 砍掉七成。',why:'正是你这套工作台的省钱关键，可直接落地。',category:'工作流'},

$('#bDemo').onclick = () => {

    d.id = 'demo'+i; d.url = 'https://example.com/'+i;
    d.text = d.summary; d.lv = lvOf(d.score); d.category = d.category;
    S.seen[d.id] = 1;
  });
  S.items = DEMO.concat(S.items.filter(x=>!String(x.id).startsWith('demo')));
  save(); render(); toast('演示数据已载入，拖一拖卡片试试');

/* ══════════ 启动 ══════════ */
fillCfg();
if(!S.items.length){ $('#bDemo').click(); }
else render();
